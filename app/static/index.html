<!doctype html><html><head><meta charset="utf-8"><script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script><style>body{font:16px system-ui;background:#07101c;color:#eaf2ff;max-width:1050px;margin:auto;padding:30px}.card{background:#101e31;border-radius:15px;padding:20px;margin:15px 0}input{padding:12px;width:70%}button{padding:12px;background:#60a5fa;border:0}</style></head><body><h1>Distributed ML Task Queue</h1><div class="card"><input id="text" value="this service is excellent and fast"><button id="send">Queue job</button><pre id="result"></pre></div><div class="card" id="chart"></div><script>send.onclick=async()=>{const j=await fetch('/jobs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:text.value})}).then(r=>r.json());result.textContent='queued '+j.id};async function refresh(){await fetch('/scale/sample?workers=2',{method:'POST'});const m=await fetch('/metrics').then(r=>r.json());Plotly.newPlot('chart',[{x:m.map(x=>new Date(x.ts*1000)),y:m.map(x=>x.queue_depth),name:'queue depth'},{x:m.map(x=>new Date(x.ts*1000)),y:m.map(x=>x.workers),name:'workers'}],{paper_bgcolor:'transparent',plot_bgcolor:'transparent',font:{color:'#dbeafe'}})}setInterval(refresh,2000);refresh()</script></body></html>
