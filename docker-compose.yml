services:
  redis: {image: "redis:7.4-alpine"}
  api:
    build: .
    ports: ["8000:8000"]
    environment: {REDIS_URL: "redis://redis:6379"}
    volumes: ["./data:/app/data"]
    depends_on: [redis]
  worker:
    build: .
    command: ["python","-m","app.worker"]
    environment: {REDIS_URL: "redis://redis:6379"}
    depends_on: [redis]
